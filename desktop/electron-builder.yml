# Windows packaging for Mikozora (see .github/workflows/desktop.yml).
# The version comes from desktop/package.json, kept in lockstep with the
# Android app version by the version-consistency test. Unsigned for now:
# Windows SmartScreen will ask for "More info -> Run anyway" on first
# launch, like sideloading the Android APK.
appId: app.mikozora.desktop
productName: Mikozora
copyright: Copyright © 2026 Ravenmire Labs
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - web/**
  - build/icon.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
# Per-user one-click install (no admin prompt).
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Mikozora-v${version}-Windows-Setup.exe
portable:
  artifactName: Mikozora-v${version}-Windows-Portable.exe
# Releases are published by the workflow with gh, mirroring the APK flow.
publish: null
