name: MovieApp Build

on:
  push:
    branches: [arena/aa387824-moku-anime]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: movie-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build web app
        working-directory: movie-app
        run: |
          npm ci
          npm run build

      - name: Copy web assets to Android
        working-directory: movie-app
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -r dist/* android/app/src/main/assets/web/

      - name: Build debug APK
        working-directory: movie-app/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug > gradle-build.log 2>&1 || true

      - name: Show gradle log
        working-directory: movie-app/android
        run: |
          echo "===== GRADLE BUILD LOG (last 200 lines) ====="
          tail -200 gradle-build.log
          echo "===== END LOG ====="

      - name: Check APK exists
        run: |
          APK="movie-app/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Looking for APK at: $APK"
          ls -la "$APK" 2>&1 || echo "APK NOT FOUND at expected path"
          find movie-app/android/app/build -name "*.apk" 2>&1 || echo "No APK found in build directory"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: movie-app/android/gradle-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MovieHub-debug-apk
          path: movie-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
