name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or replace the APK on the GitHub Release for this version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      replace: ${{ steps.release.outputs.replace }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Determine release publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          publish=false
          replace=false

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            replace=true
          elif [[ "$MANUAL_PUBLISH" == "true" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            publish=true
            replace=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              publish=true
            fi
          fi

          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::Release tag $tag does not match the project version v${version}."
            exit 1
          fi

          {
            echo "publish=$publish"
            echo "replace=$replace"
            if [[ "$publish" == "true" ]]; then
              echo "tag=$tag"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "publish=$publish replace=$replace tag=$tag"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare permanent release signing
        if: steps.release.outputs.publish == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIKOZORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIKOZORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIKOZORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIKOZORA_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("MIKOZORA_KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("MIKOZORA_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("MIKOZORA_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("MIKOZORA_KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secret: %s\n' "${missing[@]}"
            echo "Add the permanent signing secrets before publishing a release. See docs/SIGNING.md."
            exit 1
          fi

          keystore="$RUNNER_TEMP/release-signing.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"

          # Fail here, in seconds and in plain language, if the four secret
          # values do not actually open the key inside the decoded file,
          # instead of surfacing later as a generic Gradle signing failure.
          verify_keystore="$RUNNER_TEMP/signing-verify.p12"
          rm -f "$verify_keystore"
          if ! keytool -importkeystore -noprompt \
              -srckeystore "$keystore" -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$verify_keystore" -deststoretype PKCS12 \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destalias "$KEY_ALIAS" -destkeypass "$KEY_PASSWORD" >/dev/null; then
            rm -f "$verify_keystore"
            echo "::error::The permanent signing secrets do not open the key in the decoded keystore. Check that MIKOZORA_KEYSTORE_BASE64 is the Base64 of your PKCS12 (.p12) file, that MIKOZORA_KEYSTORE_PASSWORD and MIKOZORA_KEY_PASSWORD match that file, and that MIKOZORA_KEY_ALIAS names a key in it. See docs/SIGNING.md."
            exit 1
          fi
          rm -f "$verify_keystore"
          echo "Permanent release signing is configured."
      - name: Prepare throwaway CI signing check
        if: ${{ !(steps.release.outputs.publish == 'true' && github.event_name != 'pull_request') }}
        run: |
          keystore="$RUNNER_TEMP/ci-signing-test.p12"
          rm -f "$keystore"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass Mikozora-ci-test \
            -keypass Mikozora-ci-test \
            -alias Mikozora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mikozora CI test, O=Mikozora, C=PK" >/dev/null
          chmod 600 "$keystore"
          echo "Using a throwaway key only to verify the release-signing wiring; the uploaded non-release artifact remains a debug build."
      - run: npm ci
      - run: npm test
      - run: npm run prepare:android
      - name: Build permanently signed release APK
        if: steps.release.outputs.publish == 'true' && github.event_name != 'pull_request'
        working-directory: android
        env:
          MIKOZORA_KEYSTORE_PATH: ${{ runner.temp }}/release-signing.p12
          MIKOZORA_KEYSTORE_PASSWORD: ${{ secrets.MIKOZORA_KEYSTORE_PASSWORD }}
          MIKOZORA_KEY_ALIAS: ${{ secrets.MIKOZORA_KEY_ALIAS }}
          MIKOZORA_KEY_PASSWORD: ${{ secrets.MIKOZORA_KEY_PASSWORD }}
          MIKOZORA_KEYSTORE_TYPE: PKCS12
        run: |
          if [[ ! -s "$MIKOZORA_KEYSTORE_PATH" ]]; then
            echo "::error::The decoded release keystore is missing, so the release APK would be unsigned. Stopping instead of publishing an unsigned build."
            exit 1
          fi
          ./gradlew assembleRelease
          mkdir -p app/build/outputs/apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/Mikozora.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/Mikozora.apk
      - name: Build debug APK and verify release-signing wiring
        if: ${{ !(steps.release.outputs.publish == 'true' && github.event_name != 'pull_request') }}
        working-directory: android
        env:
          MIKOZORA_KEYSTORE_PATH: ${{ runner.temp }}/ci-signing-test.p12
          MIKOZORA_KEYSTORE_PASSWORD: Mikozora-ci-test
          MIKOZORA_KEY_ALIAS: Mikozora
          MIKOZORA_KEY_PASSWORD: Mikozora-ci-test
          MIKOZORA_KEYSTORE_TYPE: PKCS12
        run: |
          ./gradlew assembleRelease assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk >/dev/null
          mkdir -p app/build/outputs/apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/Mikozora.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/Mikozora.apk >/dev/null
      - name: Remove temporary keystores
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/release-signing.p12" \
            "$RUNNER_TEMP/signing-verify.p12" \
            "$RUNNER_TEMP/ci-signing-test.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: Mikozora-Android
          path: android/app/build/outputs/apk/Mikozora.apk

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Mikozora-Android
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          REPLACE_ASSET: ${{ needs.build.outputs.replace }}
        run: |
          # Derive the asset name here instead of passing it through a job
          # output: the signing-key alias secret ("Mikozora") appears inside
          # this filename, and GitHub discards job outputs that may contain
          # a secret ("Skip output 'apk' since it may contain secret").
          release_apk="Mikozora-${RELEASE_TAG}-Android.apk"
          cp release/Mikozora.apk "$release_apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$REPLACE_ASSET" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$release_apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$release_apk" \
              --title "Mikozora $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
