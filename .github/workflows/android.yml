name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or replace the APK on the GitHub Release for this version
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      replace: ${{ steps.release.outputs.replace }}
      tag: ${{ steps.release.outputs.tag }}
      apk: ${{ steps.release.outputs.apk }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Determine release publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          publish=false
          replace=false

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            replace=true
          elif [[ "$MANUAL_PUBLISH" == "true" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            publish=true
            replace=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              publish=true
            fi
          fi

          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::Release tag $tag does not match the project version v${version}."
            exit 1
          fi

          {
            echo "publish=$publish"
            echo "replace=$replace"
            if [[ "$publish" == "true" ]]; then
              echo "tag=$tag"
              echo "apk=Mikozora-${tag}-Android.apk"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "publish=$publish replace=$replace tag=$tag"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run prepare:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: Mikozora-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Mikozora-Android-debug
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_APK: ${{ needs.build.outputs.apk }}
          REPLACE_ASSET: ${{ needs.build.outputs.replace }}
        run: |
          cp release/app-debug.apk "$RELEASE_APK"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$REPLACE_ASSET" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" \
              --title "Mikozora $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
