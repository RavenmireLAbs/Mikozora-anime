plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('MIKOZORA_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('MIKOZORA_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MIKOZORA_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MIKOZORA_KEY_PASSWORD')
def releaseKeystoreType = System.getenv('MIKOZORA_KEYSTORE_TYPE') ?: 'PKCS12'
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().empty }

android {
    namespace 'app.moku.anime'
    compileSdk 35
    defaultConfig {
        // Legacy application ID retained so pre-rebrand installs update in place.
        applicationId 'app.moku.anime'
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName '0.12.0'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType releaseKeystoreType
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-muxer:1.4.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.concurrent:concurrent-futures:1.0.0'
    implementation 'org.jsoup:jsoup:1.17.2'
}
